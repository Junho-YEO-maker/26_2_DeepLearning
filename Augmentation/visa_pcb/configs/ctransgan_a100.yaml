seed: 7017
profile: a100_colab
require_cuda: true
data_root: /content/drive/MyDrive/DL_TP/data/VisA
splits: splits
checkpoints: checkpoints/ctransgan_a100
output_root: outputs
model: ctransgan
n_per_pcb: 500
long_side: 512
context_pixels: 2
feather_pixels: 2.0
patch_size: 32
network:
  noise_dim: 128
  encoder_width: 128
  encoder_depth: 3
  generator_width: 256
  generator_depths: [2, 2, 1]
  heads: 4
  gradient_checkpointing: true
training:
  classifier_steps: 200
  gan_steps: 4000
  batch_size: 32
  gradient_accumulation: 1
  learning_rate: 0.0001
  betas: [0.5, 0.999]
  amp: true
  checkpoint_every: 100
  log_every: 20
metrics:
  kid_subset_size: 25
  kid_subsets: 100
  lpips_pairs: 1000
  inception_size: 299
  lpips_size: 256
  batch_size: 16
  device: auto
  cpu_threads: 4
